name: Pulse CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-ci:
    name: Backend (Go) Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Verify Code Format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Build API Binary
        run: go build -v ./cmd/api

      - name: Build Worker Binary
        run: go build -v ./cmd/worker

      - name: Run Tests
        run: go test -v ./...

  frontend-ci:
    name: Frontend (Next.js) Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Next.js Project
        run: npm run lint --if-present

      - name: Build Next.js Web App
        run: npm run build
